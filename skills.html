<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - กิจกรรมที่เข้าร่วม</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: #fff7fb;
            color: #8f3d60;
            padding-bottom: 40px;
        }

        /* แถบเมนูด้านบน */
        nav {
            background: #c75b83;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #fff8fb;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        nav a.active {
            color: #ffe4ef;
            border-bottom: 2px solid #ffe4ef;
            padding-bottom: 4px;
        }

        /* พื้นที่เนื้อหาหลัก */
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 50px 40px;
            border-radius: 12px;
            border: 1px solid #f3c4d8;
            box-shadow: 0 4px 15px rgba(199, 91, 131, 0.12);
        }

        h1 {
            color: #c75b83;
            font-size: 2rem;
            border-left: 5px solid #d98aa8;
            padding-left: 15px;
            margin-bottom: 35px;
        }

        /* การ์ดกิจกรรมแต่ละรายการ */
        .activity-card {
            background: #fff5f9;
            border: 1px solid #f7c9dc;
            border-top: 4px solid #d66a91;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 35px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(199, 91, 131, 0.08);
        }

        .activity-card h2 {
            font-size: 1.35rem;
            color: #c75b83;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 2px solid #f3c4d8;
            padding-bottom: 10px;
        }

        /* กล่องรูปภาพขนาดใหญ่ */
        .activity-img-box {
            margin-bottom: 20px;
            text-align: center;
        }

        .activity-img-box img {
            width: 100%;
            max-width: 550px;
            height: auto;
            border-radius: 8px;
            border: 2px solid #ec9fbb;
            box-shadow: 0 4px 12px rgba(199, 91, 131, 0.12);
        }

        .activity-card p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #8f3d60;
            text-align: left;
            background: #fff;
            padding: 15px 20px;
            border-radius: 6px;
            border-left: 4px solid #d98aa8;
        }
    </style>
</head>

<body>

<!-- เมนูเปลี่ยนหน้า -->
<nav>
    <a href="index.html">หน้าปก</a>
    <a href="intro.html">คำนำ</a>
    <a href="profile.html">ประวัติส่วนตัว</a>
    <a href="education.html">ความสนใจศึกษาต่อ</a>
    <a href="activities.html" class="active">กิจกรรม</a>
    <a href="skills.html">ความสามารถพิเศษ</a>
</nav>

<div class="container">

    <h1>ความสามารถพิเศษ/ทักษะ</h1>

    <!-- กิจกรรมที่ 1 -->
    <div class="activity-card">

        <h2>ทักษะการเอาใจใส่และให้กำลังใจผู้อื่น</h2>

        <div class="activity-img-box">
            <img src="IMG_1803.jpeg" alt="ทักษะการเอาใจใส่และให้กำลังใจผู้อื่น">
        </div>

        <p>
            วันฉีดวัคซีนไข้หวัดใหญ่ปี 2569
        </p>

    </div>

    <!-- กิจกรรมที่ 2 -->
    <div class="activity-card">

        <h2>เปิดโลกวิชาการ</h2>

        <div class="activity-img-box">
            <img src="IMG_3294.jpeg" alt="เปิดโลกวิชาการ">
        </div>

        <p>
            ได้เข้าร่วมกิจกรรมการปลูกป่าชายเลน
        </p>

    </div>

</div>

</body>
</html>
